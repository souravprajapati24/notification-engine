spring:

  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      leak-detection-threshold: 60000

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false


  kafka:
    admin:
      auto-create: false

    consumer:

      auto-offset-reset: latest
    listener:
      concurrency: 3


server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never


logging:
  level:
    com.notification.notificationengine: INFO
    org.springframework.kafka: WARN
    org.apache.kafka: WARN
    org.springframework.data: WARN
    org.springframework.web: WARN
    org.hibernate: WARN
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.postgresql: WARN


  file:
    name: ${LOG_FILE_PATH:/tmp/logs/notification-engine.log}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 10


  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, info
  endpoint:
    health:
      show-details: when-authorized
  prometheus:
    metrics:
      export:
        enabled: true


app:
  throttle:

    sms-max-concurrent: 20
    email-max-concurrent: 50

    retry:
      max-batch-size: 20
      batch-delay-ms: 100

    api-rate-limit:
      requests-per-minute: 1000