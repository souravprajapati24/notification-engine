<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WebSocket Notification Test</title>

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        input {
            padding: 8px;
            margin-right: 10px;
        }

        button {
            padding: 8px 12px;
        }

        #status {
            margin-top: 20px;
            font-weight: bold;
        }

        #notifications {
            margin-top: 20px;
        }

        .notification {
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #f8f8f8;
        }

    </style>
</head>

<body>

<h1>WebSocket Notification Test</h1>

<input
        type="text"
        id="userId"
        placeholder="Enter User ID"
/>

<button onclick="connect()">
    Connect
</button>

<div id="status"></div>

<div id="notifications"></div>

<script>

    let stompClient = null;

    function connect() {

        const userId =
            document.getElementById('userId').value;

        if (!userId) {

            alert('Please enter user ID');

            return;
        }

        const socket =
            new SockJS('/ws?userId=' + userId);

        stompClient = Stomp.over(socket);

        stompClient.connect({}, function () {

            document.getElementById('status').innerHTML =
                'Connected as: ' + userId;

            console.log(
                'Connected to websocket as user:',
                userId
            );

            stompClient.subscribe(
                '/user/queue/notifications',
                function (message) {

                    const notification =
                        JSON.parse(message.body);

                    console.log(
                        'Notification received:',
                        notification
                    );

                    showNotification(notification);

                    sendAcknowledgement(
                        notification.eventId,
                        userId
                    );
                }
            );
        });
    }

    function sendAcknowledgement(eventId, userId) {

        const ackPayload = {

            eventId: eventId,

            userId: userId,

            acknowledgedAt:
                new Date().toISOString()
        };

        stompClient.send(
            '/app/ack',
            {},
            JSON.stringify(ackPayload)
        );

        console.log(
            'ACK sent for event:',
            eventId
        );
    }

    function showNotification(notification) {

        const notificationsDiv =
            document.getElementById('notifications');

        const div =
            document.createElement('div');

        div.className = 'notification';

        div.innerHTML = `

            <strong>Event ID:</strong>
            ${notification.eventId}<br><br>

            <strong>User ID:</strong>
            ${notification.userId}<br><br>

            <strong>Subject:</strong>
            ${notification.subject}<br><br>

            <strong>Message:</strong>
            ${notification.message}<br><br>

            <strong>Channels:</strong>
            ${notification.channels}<br><br>

            <strong>Created At:</strong>
            ${notification.createdAt}

        `;

        notificationsDiv.prepend(div);
    }

</script>

</body>
</html>
